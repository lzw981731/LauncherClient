name: Build LauncherClient

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Launcher.csproj

      - name: Publish
        run: dotnet publish Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -o out/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LauncherClient-${{ matrix.rid }}
          path: out/${{ matrix.rid }}
          retention-days: 30